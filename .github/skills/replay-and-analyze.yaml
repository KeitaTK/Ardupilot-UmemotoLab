name: "RLS CSV Replay & Analysis"
description: "Build RLS_CSV_Replay -> Run simulation -> Generate baseline comparison graphs (RLS/EKF migration)"
steps:
  - name: "Activate virtual environment"
    run: |
      cd /home/memoto/Ardupilot-UmemotoLab
      source venv_ardupilot/bin/activate

  - name: "Build RLS_CSV_Replay example"
    run: |
      cd /home/memoto/Ardupilot-UmemotoLab
      source venv_ardupilot/bin/activate
      ./waf examples --targets=RLS_CSV_Replay

  - name: "Run CSV replay simulation"
    run: |
      cd /home/memoto/Ardupilot-UmemotoLab
      source venv_ardupilot/bin/activate
      ./build/sitl/libraries/AP_Observer/examples/RLS_CSV_Replay

  - name: "Generate comparison graphs"
    run: |
      cd /home/memoto/Ardupilot-UmemotoLab
      source venv_ardupilot/bin/activate
      python3 analysis/scripts/plot_rls_freq_compare.py

success_message: "✅ Replay completed! Use these results as baseline for RLS/EKF comparison in analysis/replay/results/"
failure_message: "❌ Replay failed. Verify observer estimation logic and replay inputs."
